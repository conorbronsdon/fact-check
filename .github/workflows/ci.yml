name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to the same PR or branch cancels the superseded run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        # Ubicloud managed runners (personal-context#1340): GitHub-hosted
        # minutes on this private repo are billing-blocked. Ubicloud's image is
        # Ubuntu 24.04; setup-python has a 3.9 build for it, so the 3.9 floor
        # keeps its own job.
        include:
          - python-version: "3.9"
            os: ubicloud-standard-2
          - python-version: "3.13"
            os: ubicloud-standard-2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Validate SKILL.md frontmatter
        run: |
          git clone --depth 1 https://github.com/conorbronsdon/agent-skill-builder /tmp/asb
          python /tmp/asb/scripts/validate_skill.py --profile agentskills .
